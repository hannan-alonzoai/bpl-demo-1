<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OT Monitoring · Surgery Schedule Layout</title>
  <style>
:root{
  --ink:#1a2332;--ink-soft:#6b7280;--line:#e5e7eb;--bg:#eef1f5;--card:#fff;
  --ring-track:#eef1f6;--track:#e8ecf2;--blue:#0ea5e9;--blue-dark:#0369a1;
  --critical:#dc2626;--critical-bg:#fee2e2;
  --attention:#b45309;--attention-bg:#fef3c7;
  --caution:#c2410c;--caution-bg:#ffedd5;
  --stable:#059669;--stable-bg:#d1fae5;--priority:#9333ea;
  --accent-top-critical:#ef4444;--accent-top-attention:#f59e0b;
  --accent-top-caution:#f97316;--accent-top-stable:#22c55e;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{font-family:'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

.page{max-width:1280px;margin:0 auto;padding:28px 24px 40px}
.page-title{margin:0 0 22px;font-size:26px;font-weight:700;letter-spacing:-0.3px;color:var(--ink)}

.ot-strip-section{margin-bottom:20px}
.ot-strip-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.ot-search{
  flex:1;min-width:180px;max-width:340px;
  padding:8px 12px;border:1px solid var(--line);border-radius:8px;
  font-family:inherit;font-size:13px;background:var(--card);color:var(--ink);
}
.ot-search:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(14,165,233,.2)}
.ot-count{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.ot-top-scroll{
  overflow-x:auto;overflow-y:hidden;
  padding-bottom:6px;margin:0 -4px;padding-left:4px;padding-right:4px;
  -webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
}
.ot-top-scroll::-webkit-scrollbar{height:8px}
.ot-top-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.ot-top-row.strip-row{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr)) auto;
  gap:12px;
  align-items:stretch;
  min-width:0;padding-bottom:2px;
}
.ot-top-row.strip-row .ot-theatre-card{flex:none;width:100%;max-width:none}
.ot-expand-btn{
  align-self:center;min-width:34px;width:34px;height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:4px 3px;border:1px dashed var(--line);border-radius:8px;
  background:var(--card);color:var(--ink-soft);cursor:pointer;font-family:inherit;
  transition:background .15s,border-color .15s,box-shadow .15s;
}
.ot-expand-btn:hover{border-color:var(--blue);color:var(--blue-dark);background:rgba(14,165,233,.06)}
.ot-expand-btn.open{border-style:solid;border-color:var(--blue);box-shadow:0 0 0 2px rgba(14,165,233,.2)}
.ot-expand-chevron{font-size:10px;line-height:1;opacity:.85;transition:transform .2s}
.ot-expand-btn.open .ot-expand-chevron{transform:rotate(180deg)}
.ot-expand-count{font-size:9px;font-weight:700;color:var(--ink-soft);line-height:1}
.ot-more-panel{
  display:grid;grid-template-rows:0fr;
  opacity:0;margin-top:0;overflow:hidden;
  transition:grid-template-rows .42s ease,opacity .32s ease,margin-top .38s ease;
  pointer-events:none;
}
.ot-more-panel.open{
  grid-template-rows:1fr;opacity:1;margin-top:12px;pointer-events:auto;
}
.ot-more-panel-inner{min-height:0;overflow:hidden}
.ot-more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:2px 0 4px}
@media(prefers-reduced-motion:reduce){
  .ot-more-panel{transition-duration:.01ms}
}
.ot-theatre-card{
  flex:0 0 272px;
  scroll-snap-align:start;
  background:var(--card);
  border-radius:10px;
  border:1px solid var(--line);
  border-top:4px solid var(--line);
  box-shadow:0 1px 3px rgba(15,23,42,.06);
  padding:12px 12px 10px;
  cursor:pointer;
  text-align:left;
  font-family:inherit;
  transition:box-shadow .15s,border-color .15s;
  display:flex;align-items:stretch;
}
.theatre-card-inner{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.theatre-card-header{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;min-width:0}
.theatre-card-meta-line{
  display:flex;align-items:center;gap:5px;width:100%;min-width:0;
}
.theatre-id{font-size:13px;font-weight:800;color:var(--ink);line-height:1.15;flex-shrink:0}
.theatre-card-meta-sep{color:var(--ink-soft);font-size:10px;font-weight:500;flex-shrink:0;line-height:1}
.theatre-card-meta-line .theatre-stage{
  font-size:9.5px;font-weight:700;padding:2px 7px;line-height:1.2;flex-shrink:1;min-width:0;
  border-radius:20px;background:var(--track);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.theatre-card-alert-below{
  max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  width:fit-content;font-size:9.5px;font-weight:600;line-height:1.25;padding:3px 7px;border-radius:4px;
  background:var(--critical-bg);color:var(--critical);
}
.theatre-card-alert-below.is-empty{visibility:hidden}
.theatre-card-body{display:flex;align-items:stretch;gap:8px;width:100%;min-width:0}
.theatre-card-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.theatre-proc{margin:0;font-size:13px;font-weight:700;line-height:1.25;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.theatre-asa-below{
  display:inline-block;width:fit-content;max-width:100%;margin-top:2px;
  font-size:10px;font-weight:700;color:var(--ink-soft);
  background:var(--track);padding:3px 8px;border-radius:6px;
  align-self:flex-start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.theatre-card-alert-below + .theatre-patient-line{margin-top:10px}
.theatre-patient-line{
  margin:0;font-size:11px;line-height:1.35;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.theatre-patient-line .theatre-patient-label{font-weight:600;color:var(--ink-soft);margin-right:4px}
.theatre-patient-line .theatre-patient-value{font-weight:700;color:var(--ink)}
.theatre-card-right{
  flex-shrink:0;width:78px;align-self:stretch;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
}
.theatre-card-right .compact-pie{display:flex;flex-direction:column;align-items:center;justify-content:center}
.theatre-card-right .compact-pie svg{width:70px;height:70px;display:block}
.theatre-card-right .compact-pie .pie-bg,
.theatre-card-right .compact-pie .pie-fg{stroke-width:3}
.theatre-card-right .compact-pie .pie-num{font-size:10px;font-weight:800;letter-spacing:-0.02em}
.theatre-card-right .compact-pie-label{font-size:9px;text-transform:uppercase;letter-spacing:.3px;margin-top:4px}
.theatre-strip-vitals{
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px 6px;
  margin-top:auto;padding-top:8px;border-top:1px solid var(--line);
}
.theatre-strip-vitals .strip-vital{text-align:center;min-width:0}
.theatre-strip-vitals .strip-vital-label{font-size:9px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.15px;line-height:1.2;margin-bottom:2px}
.theatre-strip-vitals .strip-vital-value{font-size:13px;font-weight:700;line-height:1.15;color:var(--blue-dark)}
.theatre-strip-vitals .strip-vital-value.vclass-caution{color:var(--caution)}
.theatre-strip-vitals .strip-vital-value.vclass-critical{color:var(--critical)}
.ot-theatre-card:hover{box-shadow:0 6px 16px rgba(15,23,42,.1)}
.ot-theatre-card.selected{
  border-color:var(--blue);
  box-shadow:0 0 0 2px rgba(14,165,233,.25);
}
.ot-theatre-card[data-status="critical"]{border-top-color:var(--accent-top-critical)}
.ot-theatre-card[data-status="attention"]{border-top-color:var(--accent-top-attention)}
.ot-theatre-card[data-status="caution"]{border-top-color:var(--accent-top-caution)}
.ot-theatre-card[data-status="stable"]{border-top-color:var(--accent-top-stable)}

.status-note{display:block;margin-top:6px;font-size:10.5px;font-weight:700}
.status-note.delayed{color:var(--critical)}
.status-note.scheduled{color:var(--blue-dark)}

.detail-panel{
  background:var(--card);
  border-radius:12px;
  border:1px solid var(--line);
  box-shadow:0 1px 3px rgba(15,23,42,.06);
  min-height:420px;
  display:flex;
  flex-direction:column;
}
.detail-panel-head{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--line);
}
.detail-panel-headline{
  display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;
  flex:1;min-width:min(100%,280px);
}
.detail-panel-head h2{margin:0;font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.35;white-space:nowrap}
.detail-panel-head h2 .detail-title-sep{color:var(--ink-soft);font-weight:500;margin:0 6px}
.detail-panel-badges{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-width:0}
.detail-panel-badges .theatre-stage{font-size:11px;font-weight:700;padding:4px 11px;flex-shrink:0;border-radius:20px;background:var(--track);color:var(--ink)}
.detail-panel-badges .alert-strip-inline{
  margin:0;padding:5px 10px;font-size:12px;font-weight:600;line-height:1.3;
  flex:0 1 auto;max-width:min(100%,420px);
}
.detail-empty{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:48px 24px;color:var(--ink-soft);font-size:14px;text-align:center;
}
.detail-empty.detail-loading{flex-direction:column;gap:14px}
.detail-load-spinner{
  width:44px;height:44px;border-radius:50%;
  border:3px solid var(--track);border-top-color:var(--blue);
  animation:detail-load-spin .9s linear infinite;
}
.detail-load-text{font-size:14px;font-weight:600;color:var(--ink);margin:0}
.detail-load-sub{font-size:12px;color:var(--ink-soft);margin:0;max-width:280px;line-height:1.45}
@keyframes detail-load-spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){
  .detail-load-spinner{animation-duration:.01ms;border-top-color:var(--blue);opacity:.85}
}
.detail-body{padding:18px 20px 24px;overflow-y:auto;flex:1}

.view-toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.view-toggle button{padding:6px 12px;font-size:12px;font-weight:600;background:transparent;border:none;color:var(--ink-soft);cursor:pointer;border-left:1px solid var(--line);font-family:inherit}
.view-toggle button:first-child{border-left:none}
.view-toggle button.active{background:var(--blue);color:#fff}

.detail-hero{display:flex;align-items:flex-start;gap:20px;margin-top:4px;flex-wrap:wrap}
.detail-hero-main{flex:1;min-width:280px}
.detail-hero-side{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding-top:0;min-width:168px}
.detail-title-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
.card-id{font-size:20px;font-weight:700}
.detail-title-sep{color:var(--ink-soft);font-weight:500}
.detail-surgery{font-size:15px;font-weight:700;color:var(--ink)}
.status-pill{font-size:11px;font-weight:700;padding:4px 11px;border-radius:20px;white-space:nowrap}
.detail-patient-name{margin-top:10px;font-size:15px;font-weight:600;color:var(--ink)}
.detail-patient-label{font-weight:600;color:var(--ink-soft);margin-right:6px}
.detail-hero .vitals-row{margin-top:12px}
.detail-stages{margin-top:16px}
.detail-hero-main .detail-stages,
.detail-hero > .detail-stages{margin-top:0}
.detail-stages-label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.35px;margin-bottom:8px}
.stage-boxes-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.stage-boxes{display:flex;align-items:stretch;gap:8px;min-width:min-content}
.stage-box{
  display:flex;flex-direction:column;align-items:flex-start;min-width:92px;max-width:110px;
  padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
  flex-shrink:0;text-align:left;cursor:default;
}
.stage-box.done{border-color:rgba(14,165,233,.35);background:rgba(14,165,233,.06)}
.stage-box.current{border-color:var(--blue);background:var(--blue);box-shadow:0 4px 12px rgba(14,165,233,.28)}
.stage-box-num{
  font-size:10px;font-weight:700;color:var(--ink-soft);width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:var(--track);margin-bottom:5px;
}
.stage-box.current .stage-box-num{background:rgba(255,255,255,.25);color:#fff}
.stage-box-name{font-size:10.5px;font-weight:600;color:var(--ink);line-height:1.25}
.stage-box.current .stage-box-name{color:#fff}
.stage-box-time{font-size:9.5px;color:var(--ink-soft);margin-top:3px}
.stage-box.current .stage-box-time{color:rgba(255,255,255,.88)}
.detail-hero-main .alert-strip{margin-top:12px;margin-bottom:0}
.status-critical{color:var(--critical);background:var(--critical-bg)}
.status-attention{color:var(--attention);background:var(--attention-bg)}
.status-caution{color:var(--caution);background:var(--caution-bg)}
.status-stable{color:var(--stable);background:var(--stable-bg)}
.patient-line{margin-top:8px;font-size:15px;font-weight:600}
.procedure-line{margin-top:4px;font-size:13px;color:var(--ink-soft)}

.vitals-row{display:flex;gap:24px;flex-wrap:wrap;flex:1}
.vital .label{font-size:11px;color:var(--ink-soft);margin-bottom:2px}
.vital .value{font-size:18px;font-weight:700;color:var(--blue-dark)}
.vclass-normal{--vc:var(--blue-dark)}.vclass-caution{--vc:var(--caution)}.vclass-critical{--vc:var(--critical)}
.vital .value.vclass-normal,.vital .value.vclass-caution,.vital .value.vclass-critical,.num-value.vclass-normal,.num-value.vclass-caution,.num-value.vclass-critical,.bar-row .bar-value.vclass-normal,.bar-row .bar-value.vclass-caution,.bar-row .bar-value.vclass-critical{color:var(--vc)}
.ring-fg.vclass-normal,.ring-fg.vclass-caution,.ring-fg.vclass-critical{stroke:var(--vc)}
.bar-fill.vclass-normal,.bar-fill.vclass-caution,.bar-fill.vclass-critical{background:var(--vc)}

.compact-pie{flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.compact-pie .pie-bg{fill:none;stroke:var(--track);stroke-width:4}
.compact-pie .pie-fg{fill:none;stroke:var(--blue);stroke-width:4;stroke-linecap:round}
.compact-pie .pie-num{font-weight:800;fill:var(--ink);font-family:inherit}
.compact-pie-label{margin-top:3px;font-size:10px;color:var(--ink-soft)}
.compact-pie.progress-pie-detail svg{width:156px;height:156px;display:block}
.compact-pie.progress-pie-detail .pie-bg,.compact-pie.progress-pie-detail .pie-fg{stroke-width:11}
.compact-pie.progress-pie-detail .pie-num{font-size:22px}
.compact-pie.progress-pie-detail .compact-pie-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.35px;margin-top:8px}

.alert-strip{margin-top:14px;background:var(--critical-bg);color:var(--critical);font-size:13px;font-weight:600;padding:8px 12px;border-radius:6px}
.completion{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.completion-top{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:10px}
.status-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.status-chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.status-chip.on-track{background:var(--stable-bg);color:var(--stable)}
.status-chip.watch{background:var(--attention-bg);color:var(--attention)}
.priority-badge{width:20px;height:20px;border-radius:50%;background:var(--priority);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.progress-head{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-bottom:6px}
.progress-head b{color:var(--ink);font-size:14px}
.progress-track{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.progress-fill{height:100%;background:var(--blue);border-radius:4px}
.completion-info{font-size:12.5px;margin-top:10px}
.ci-tagrow{margin-bottom:7px}
.ci-tag{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:10px;background:var(--track);color:var(--ink-soft)}
.ci-tag.risk{background:var(--attention-bg);color:var(--attention)}
.ci-row{display:flex;justify-content:space-between;margin-bottom:5px;color:var(--ink-soft);font-size:12.5px}
.ci-row b{color:var(--ink)}
.ci-delay{font-size:10px;font-weight:700;background:var(--attention-bg);color:var(--attention);padding:1px 7px;border-radius:8px;margin-left:6px}
.ci-pill{font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:10px}
.ci-pill.ready{background:var(--stable-bg);color:var(--stable)}
.ci-pill.notready{background:var(--track);color:var(--ink-soft)}

.detail-vitals{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.detail-vitals h3{margin:0 0 14px;font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.3px;text-transform:uppercase}
.detail-inner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.detail-group h4{margin:0 0 10px;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--critical)}
.detail-group.vent h4{color:var(--blue-dark)}
.detail-group.temp h4{color:var(--caution)}

.gauge-row{display:flex;gap:12px;flex-wrap:wrap}
.gauge{text-align:center;width:56px}
.gauge svg{width:56px;height:56px;display:block}
.gauge .ring-bg{fill:none;stroke:var(--ring-track);stroke-width:6}
.gauge .ring-fg{fill:none;stroke-width:6;stroke-linecap:round}
.gauge-num{font-size:13px;font-weight:700;fill:var(--ink);font-family:inherit}
.gauge .g-label{font-size:10px;color:var(--ink-soft);margin-top:4px}
.gauge .g-unit{font-size:9px;color:#9ca3af}
.bar-list{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:72px 1fr 52px;align-items:center;gap:8px}
.bar-row .bar-label{font-size:11px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar-fill{height:100%;border-radius:3px}
.bar-row .bar-value{font-size:12px;font-weight:700;text-align:right}
.bar-row .bar-value small{font-weight:500;color:var(--ink-soft)}
.num-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px}
.num-item .num-label{font-size:10px;color:var(--ink-soft)}
.num-item .num-value{font-size:15px;font-weight:700}
.num-item .num-value small{font-size:10px;font-weight:500;color:var(--ink-soft)}

@media(min-width:721px){
  .ot-top-row.strip-row:not(.mobile-stack) .theatre-card-body,
  .ot-more-grid .theatre-card-body{gap:10px}
  .ot-top-row.strip-row:not(.mobile-stack) .theatre-card-right,
  .ot-more-grid .theatre-card-right{
    width:90px;min-width:90px;padding-left:2px;margin-top:0;
  }
  .ot-top-row.strip-row:not(.mobile-stack) .theatre-asa-below,
  .ot-more-grid .theatre-asa-below{padding:4px 9px;font-size:10px}
  .ot-top-row.strip-row:not(.mobile-stack) .theatre-card-right .compact-pie,
  .ot-more-grid .theatre-card-right .compact-pie{padding-top:0}
  .ot-top-row.strip-row:not(.mobile-stack) .theatre-card-right .compact-pie svg,
  .ot-more-grid .theatre-card-right .compact-pie svg{width:80px;height:80px}
  .ot-top-row.strip-row:not(.mobile-stack) .theatre-card-right .compact-pie .pie-num,
  .ot-more-grid .theatre-card-right .compact-pie .pie-num{font-size:11px}
  .ot-top-row.strip-row:not(.mobile-stack) .theatre-card-right .compact-pie .pie-bg,
  .ot-top-row.strip-row:not(.mobile-stack) .theatre-card-right .compact-pie .pie-fg,
  .ot-more-grid .theatre-card-right .compact-pie .pie-bg,
  .ot-more-grid .theatre-card-right .compact-pie .pie-fg{stroke-width:3}
  .ot-top-row.strip-row:not(.mobile-stack) .theatre-card-right .compact-pie-label,
  .ot-more-grid .theatre-card-right .compact-pie-label{
    margin-top:5px;line-height:1.25;letter-spacing:.2px;
  }
}
@media(max-width:1100px){
  .ot-top-row.strip-row{grid-template-columns:repeat(3,minmax(0,1fr)) auto}
}
@media(max-width:820px){
  .ot-top-row.strip-row{grid-template-columns:repeat(2,minmax(0,1fr)) auto}
}
@media(max-width:720px){

  .detail-panel{display:none}

    display:flex;flex-direction:column;gap:12px;
    min-width:0;padding-bottom:0;
  }
  .ot-top-row.mobile-stack{overflow-anchor:none}
  .ot-mobile-item{overflow-anchor:none}
  .ot-top-row.mobile-stack .ot-theatre-card{width:100%;flex:none;scroll-snap-align:none}
  .ot-top-row.mobile-stack .ot-expand-btn{display:none}
  .ot-strip-section .ot-more-panel{display:none!important}
  .ot-mobile-item{display:flex;flex-direction:column;gap:0;width:100%}
  .ot-mobile-item.is-open .ot-theatre-card{
    border-bottom-left-radius:0;border-bottom-right-radius:0;

  .ot-card-expand{

    border-radius:0 0 10px 10px;
    transition:grid-template-rows .38s ease,opacity .28s ease,margin-top .28s ease;
  }
  .ot-mobile-item.is-open .ot-card-expand{
    grid-template-rows:1fr;opacity:1;margin-top:-1px;
    border-color:var(--blue);
    box-shadow:0 0 0 2px rgba(14,165,233,.2);
  }
  .ot-mobile-item.instant-collapse .ot-card-expand{transition:none!important}
  .ot-card-expand-inner{min-height:0;overflow:hidden}
  .ot-card-expand-inner.detail-body{padding:12px 12px 16px}
  .ot-card-expand-inner.detail-empty.detail-loading{padding:28px 16px;min-height:120px}
  .mobile-expand-body{display:flex;flex-direction:column;gap:14px;width:100%}

  .mobile-expand-vitals .detail-inner{grid-template-columns:1fr;gap:16px}
  .ot-vitals-view-bar{

    flex-wrap:wrap;margin-bottom:10px;
  }
  .ot-vitals-view-bar.is-visible{display:flex}
  .ot-vitals-view-bar-label{font-size:12px;font-weight:600;color:var(--ink-soft)}
  .mobile-expand-vitals .detail-group h4{margin-bottom:8px}
  .detail-inner{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){
  .ot-card-expand{transition-duration:.01ms}
}

</head>
<body>
  <div class="page">
    <h1 class="page-title">Surgery Schedule</h1>
    <div class="ot-strip-section">
      <div class="ot-strip-toolbar">
        <input type="search" class="ot-search" id="ot-search" placeholder="Search OT, patient, or procedure…" autocomplete="off" />
        <span class="ot-count" id="ot-count"></span>
      </div>
      <div class="ot-vitals-view-bar" id="ot-vitals-view-bar" hidden></div>
      <div class="ot-top-scroll" id="ot-top-scroll">
        <div class="ot-top-row strip-row" id="ot-top-row"></div>
      </div>
      <div class="ot-more-panel" id="ot-more-panel" aria-hidden="true">
        <div class="ot-more-panel-inner">
          <div class="ot-more-grid" id="ot-more-grid"></div>
        </div>
      </div>
    </div>

    <section class="detail-panel" aria-live="polite">
      <div class="detail-panel-head">
        <div class="detail-panel-headline">
          <h2 id="detail-panel-title">Select an OT room</h2>
          <div class="detail-panel-badges" id="detail-panel-badges" aria-live="polite"></div>
        </div>
        <div class="view-toggle" id="view-toggle">
          <button type="button" data-view="rings" class="active">Rings</button>
          <button type="button" data-view="bars">Bars</button>
          <button type="button" data-view="numbers">Numbers</button>
        </div>
      </div>
      <div id="detail-content" class="detail-empty">Select an OT room above to view live vitals and case details.</div>
    </section>
  </div>

  <script>
    const RANGES = {
      HR:{min:60,max:100}, RR:{min:12,max:18}, Temp:{min:36.5,max:37.3},
      SpO2:{min:95,max:100,noHigh:true}, Pulse:{min:60,max:100},
      Ppeak:{min:15,max:25}, PEEP:{min:5,max:10}, Pplat:{min:15,max:25}, Pmean:{min:5,max:15},
    };

    const ROOMS = [
      {id:'OT-01',status:'critical',statusLabel:'Critical',patient:'James · ASA I',procedure:'CABG',
        vitals:[{l:'HR',v:90,key:'HR'},{l:'SpO2',v:98,key:'SpO2'},{l:'Temp1',v:25.6,key:'Temp'},{l:'PEEP',v:2,key:'PEEP'}],
        alert:'Temp2 sensor fall off',
        completion:{pct:62,status:'on-track',tag:'Surgery',priority:1,finish:'16:20',delay:null,nextReady:true},
        detail:{
          hemo:[{v:90,l:'Heart rate',u:'bpm',max:180,key:'HR'},{v:86,l:'Pulse',u:'bpm',max:180,key:'Pulse'},{v:98,l:'SpO2',u:'%',max:100,key:'SpO2'},{v:14,l:'Resp. rate',u:'/min',max:40,key:'RR'}],
          vent:[{v:19,l:'Ppeak',u:'cmH2O',max:40,key:'Ppeak'},{v:2,l:'PEEP',u:'cmH2O',max:20,key:'PEEP'},{v:6.5,l:'MV',u:'L/min',max:15},{v:16,l:'Pplat',u:'cmH2O',max:40,key:'Pplat'},{v:410,l:'VTi',u:'mL',max:800},{v:7,l:'Pmean',u:'cmH2O',max:20,key:'Pmean'}],
          temp:[{v:25.6,l:'Temp1',u:'°C',max:42,key:'Temp'},{v:35.9,l:'Temp2',u:'°C',max:42,key:'Temp'}],
        }},
      {id:'OT-05',status:'attention',statusLabel:'Attention',patient:'Rahul · ASA IV',procedure:'Emergency laparotomy',
        vitals:[{l:'HR',v:128,key:'HR'},{l:'SpO2',v:93,key:'SpO2'},{l:'Temp1',v:35.2,key:'Temp'},{l:'MAP',v:58}],
        alert:'Low urine output',
        completion:{pct:45,status:'watch',tag:'over-run risk',priority:1,finish:'17:40',delay:'+35m',nextReady:false},
        detail:{
          hemo:[{v:128,l:'Heart rate',u:'bpm',max:180,key:'HR'},{v:124,l:'Pulse',u:'bpm',max:180,key:'Pulse'},{v:93,l:'SpO2',u:'%',max:100,key:'SpO2'},{v:22,l:'Resp. rate',u:'/min',max:40,key:'RR'}],
          vent:[{v:24,l:'Ppeak',u:'cmH2O',max:40,key:'Ppeak'},{v:5,l:'PEEP',u:'cmH2O',max:20,key:'PEEP'},{v:8.2,l:'MV',u:'L/min',max:15},{v:21,l:'Pplat',u:'cmH2O',max:40,key:'Pplat'},{v:380,l:'VTi',u:'mL',max:800},{v:9,l:'Pmean',u:'cmH2O',max:20,key:'Pmean'}],
          temp:[{v:35.2,l:'Temp1',u:'°C',max:42,key:'Temp'},{v:36.1,l:'Temp2',u:'°C',max:42,key:'Temp'}],
        }},
      {id:'OT-02',status:'caution',statusLabel:'Caution',patient:'Priya · ASA II',procedure:'Hip replacement',
        vitals:[{l:'HR',v:112,key:'HR'},{l:'SpO2',v:96,key:'SpO2'},{l:'Temp1',v:36.8,key:'Temp'},{l:'MAP',v:64}],
        alert:null,
        completion:{pct:70,status:'watch',tag:'Surgery',priority:3,finish:'14:50',delay:null,nextReady:false},
        detail:{
          hemo:[{v:112,l:'Heart rate',u:'bpm',max:180,key:'HR'},{v:110,l:'Pulse',u:'bpm',max:180,key:'Pulse'},{v:96,l:'SpO2',u:'%',max:100,key:'SpO2'},{v:18,l:'Resp. rate',u:'/min',max:40,key:'RR'}],
          vent:[{v:20,l:'Ppeak',u:'cmH2O',max:40,key:'Ppeak'},{v:5,l:'PEEP',u:'cmH2O',max:20,key:'PEEP'},{v:6.8,l:'MV',u:'L/min',max:15},{v:17,l:'Pplat',u:'cmH2O',max:40,key:'Pplat'},{v:420,l:'VTi',u:'mL',max:800},{v:8,l:'Pmean',u:'cmH2O',max:20,key:'Pmean'}],
          temp:[{v:36.8,l:'Temp1',u:'°C',max:42,key:'Temp'},{v:36.9,l:'Temp2',u:'°C',max:42,key:'Temp'}],
        }},
      {id:'OT-03',status:'stable',statusLabel:'Stable',patient:'Arun · ASA III',procedure:'Bowel resection',
        vitals:[{l:'HR',v:78,key:'HR'},{l:'SpO2',v:99,key:'SpO2'},{l:'Temp1',v:37.1,key:'Temp'},{l:'MAP',v:82}],
        alert:null,
        completion:{pct:88,status:'watch',tag:'over-run risk',priority:2,finish:'15:05',delay:'+20m',nextReady:false},
        detail:{
          hemo:[{v:78,l:'Heart rate',u:'bpm',max:180,key:'HR'},{v:77,l:'Pulse',u:'bpm',max:180,key:'Pulse'},{v:99,l:'SpO2',u:'%',max:100,key:'SpO2'},{v:15,l:'Resp. rate',u:'/min',max:40,key:'RR'}],
          vent:[{v:18,l:'Ppeak',u:'cmH2O',max:40,key:'Ppeak'},{v:5,l:'PEEP',u:'cmH2O',max:20,key:'PEEP'},{v:6.0,l:'MV',u:'L/min',max:15},{v:15,l:'Pplat',u:'cmH2O',max:40,key:'Pplat'},{v:400,l:'VTi',u:'mL',max:800},{v:7,l:'Pmean',u:'cmH2O',max:20,key:'Pmean'}],
          temp:[{v:37.1,l:'Temp1',u:'°C',max:42,key:'Temp'},{v:37.0,l:'Temp2',u:'°C',max:42,key:'Temp'}],
        }},
      {id:'OT-04',status:'stable',statusLabel:'Stable',patient:'Leela · ASA II',procedure:'Thyroidectomy',
        vitals:[{l:'HR',v:70,key:'HR'},{l:'SpO2',v:99,key:'SpO2'},{l:'Temp1',v:36.9,key:'Temp'},{l:'MAP',v:78}],
        alert:null,
        completion:{pct:95,status:'on-track',tag:'Surgery',priority:4,finish:'13:10',delay:null,nextReady:true},
        detail:{
          hemo:[{v:70,l:'Heart rate',u:'bpm',max:180,key:'HR'},{v:69,l:'Pulse',u:'bpm',max:180,key:'Pulse'},{v:99,l:'SpO2',u:'%',max:100,key:'SpO2'},{v:13,l:'Resp. rate',u:'/min',max:40,key:'RR'}],
          vent:[{v:17,l:'Ppeak',u:'cmH2O',max:40,key:'Ppeak'},{v:4,l:'PEEP',u:'cmH2O',max:20,key:'PEEP'},{v:5.6,l:'MV',u:'L/min',max:15},{v:14,l:'Pplat',u:'cmH2O',max:40,key:'Pplat'},{v:390,l:'VTi',u:'mL',max:800},{v:6,l:'Pmean',u:'cmH2O',max:20,key:'Pmean'}],
          temp:[{v:36.9,l:'Temp1',u:'°C',max:42,key:'Temp'},{v:36.8,l:'Temp2',u:'°C',max:42,key:'Temp'}],
        }},
    ];

    const SAMPLE_DETAIL = ROOMS[3].detail;

    function demoRoom(id, status, statusLabel, patient, procedure, pct, finish, opts = {}) {
      const delay = opts.delay ?? null;
      const alert = opts.alert ?? null;
      const watch = opts.watch ?? !!delay;
      return {
        id, status, statusLabel, patient, procedure,
        vitals: opts.vitals ?? [
          { l: 'HR', v: 76, key: 'HR' }, { l: 'SpO2', v: 98, key: 'SpO2' },
          { l: 'Temp1', v: 36.7, key: 'Temp' }, { l: 'MAP', v: 79 },
        ],
        alert,
        completion: {
          pct, status: watch ? 'watch' : 'on-track', tag: opts.tag ?? 'Surgery',
          priority: opts.priority ?? 2, finish, delay, nextReady: opts.nextReady ?? !delay,
        },
        detail: SAMPLE_DETAIL,
      };
    }

    ROOMS.push(
      demoRoom('OT-06', 'stable', 'Stable', 'Mia · ASA II', 'Knee arthroscopy', 55, '15:30'),
      demoRoom('OT-07', 'caution', 'Caution', 'Omar · ASA III', 'Spinal fusion', 38, '18:00', { watch: true }),
      demoRoom('OT-08', 'attention', 'Attention', 'Sara · ASA IV', 'Craniotomy', 22, '19:15', { delay: '+50m', alert: 'High ICP trend' }),
      demoRoom('OT-09', 'stable', 'Stable', 'Vikram · ASA I', 'Appendectomy', 81, '14:05'),
      demoRoom('OT-10', 'stable', 'Stable', 'Nina · ASA II', 'C-section', 67, '16:45'),
      demoRoom('OT-11', 'caution', 'Caution', 'Tom · ASA III', 'Liver resection', 41, '17:55', { watch: true }),
      demoRoom('OT-12', 'stable', 'Stable', 'Aisha · ASA II', 'Hernia repair', 12, '11:30', { nextReady: true }),
    );

    const STRIP_SIZE = 4;
    let view = 'rings';
    let selectedId = null;
    let filterQuery = '';
    let moreOpen = false;
    let morePanelAnimToken = 0;
    let detailLoadTimer = null;
    const DETAIL_LOAD_MS = 1400;
    let stripIds = ROOMS.slice(0, STRIP_SIZE).map(r => r.id);
    let mobileStackKey = '';

    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function classify(key, value) {
      const r = key ? RANGES[key] : undefined;
      if (!r || value == null) return 'vclass-normal';
      const num = typeof value === 'number' ? value : parseFloat(String(value));
      if (Number.isNaN(num)) return 'vclass-normal';
      if (num < (r.min ?? 0)) return 'vclass-caution';
      if (!r.noHigh && r.max != null && num > r.max) return 'vclass-critical';
      return 'vclass-normal';
    }

    const OR_STAGES = [
      { id: 'positioning', short: 'Position', name: 'Positioning', time: '08:28' },
      { id: 'or', short: 'OR', name: 'OR', time: '08:32' },
      { id: 'anes_ready', short: 'Anes Rdy', name: 'Anes Ready', time: '08:35' },
      { id: 'catheter', short: 'Cath', name: 'Catheter Insertion', time: '08:42' },
      { id: 'anaesthesia', short: 'Anes', name: 'Anaesthesia', time: '08:48' },
      { id: 'wound_dressing', short: 'Prep', name: 'Wound Dressing', time: '08:55' },
      { id: 'surgery', short: 'Surgery', name: 'Surgery', time: '09:02' },
    ];

    function progressPieHtml(pct, label, large) {
      const clamped = Math.max(0, Math.min(100, pct));
      const caption = label || 'Completed';
      if (large) {
        const size = 156, cx = size / 2, r = 54, c = 2 * Math.PI * r, offset = c - (clamped / 100) * c;
        return `<div class="compact-pie progress-pie-detail" aria-label="${esc(caption)} ${clamped}%"><svg viewBox="0 0 ${size} ${size}"><g transform="rotate(-90 ${cx} ${cx})"><circle class="pie-bg" cx="${cx}" cy="${cx}" r="${r}"/><circle class="pie-fg" cx="${cx}" cy="${cx}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/></g><text x="${cx}" y="${cx}" text-anchor="middle" dominant-baseline="central" class="pie-num">${clamped}%</text></svg><span class="compact-pie-label">${esc(caption)}</span></div>`;
      }
      const size = 64, cx = size / 2, r = 24, c = 2 * Math.PI * r, offset = c - (clamped / 100) * c;
      return `<div class="compact-pie" aria-label="${esc(caption)} ${clamped}%"><svg viewBox="0 0 ${size} ${size}"><g transform="rotate(-90 ${cx} ${cx})"><circle class="pie-bg" cx="${cx}" cy="${cx}" r="${r}"/><circle class="pie-fg" cx="${cx}" cy="${cx}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/></g><text x="${cx}" y="${cx}" text-anchor="middle" dominant-baseline="middle" class="pie-num">${clamped}%</text></svg><span class="compact-pie-label">${esc(caption)}</span></div>`;
    }

    function stageIndexFromPct(pct) {
      if (pct >= 100) return OR_STAGES.length - 1;
      return Math.min(OR_STAGES.length - 1, Math.floor((pct / 100) * OR_STAGES.length));
    }

    function currentStageForPct(pct) {
      return OR_STAGES[stageIndexFromPct(pct)];
    }

    function stagesQuickActionsHtml(pct, opts = {}) {
      const current = stageIndexFromPct(pct);
      const list = opts.allStages ? OR_STAGES : OR_STAGES.slice(current, current + 3);
      const boxes = list.map((s, vi) => {
        let i;
        let cls = '';
        if (opts.allStages) {
          i = vi;
          if (i < current) cls = ' done';
          else if (i === current) cls = ' current';
        } else {
          i = current + vi;
          cls = vi === 0 ? ' current' : '';
        }
        return `<div class="stage-box${cls}" title="${esc(s.name)}">
          <span class="stage-box-num">${i + 1}</span>
          <span class="stage-box-name">${esc(s.short)}</span>
          <span class="stage-box-time">${esc(s.time)}</span>
        </div>`;
      }).join('');
      return `<div class="detail-stages">
        <div class="detail-stages-label">Quick actions · case stages</div>
        <div class="stage-boxes-wrap"><div class="stage-boxes">${boxes}</div></div>
      </div>`;
    }

    function setDetailPanelHeadline(room) {
      const titleEl = document.getElementById('detail-panel-title');
      const badgesEl = document.getElementById('detail-panel-badges');
      if (!titleEl || !badgesEl) return;
      if (!room) {
        titleEl.textContent = 'Select an OT room';
        badgesEl.innerHTML = '';
        return;
      }
      titleEl.innerHTML = `${esc(room.id)} <span class="detail-title-sep">|</span> ${esc(room.procedure)}`;
      const stage = currentStageForPct(room.completion.pct);
      badgesEl.innerHTML = `
        <span class="theatre-stage">${esc(stage.name)}</span>
        ${room.alert ? `<div class="alert-strip alert-strip-inline">⚠ ${esc(room.alert)}</div>` : ''}`;
    }

    function parsePatient(patient) {
      const parts = String(patient).split('·').map(s => s.trim()).filter(Boolean);
      if (parts.length >= 2) {
        return { name: parts[0], asa: parts.slice(1).join(' · ') };
      }
      return { name: patient, asa: null };
    }

    function stripVitalsHtml(vitals) {
      return vitals.map(v => {
        const vc = classify(v.key, typeof v.v === 'number' ? v.v : undefined);
        return `<div class="strip-vital"><div class="strip-vital-label">${esc(v.l)}</div><div class="strip-vital-value ${vc}">${v.v}</div></div>`;
      }).join('');
    }

    function vitalGroup(items) {
      if (view === 'bars') {
        return '<div class="bar-list">' + items.map(g => {
          const pct = Math.max(2, Math.min(100, (g.v / g.max) * 100));
          const vc = classify(g.key, g.v);
          return `<div class="bar-row"><span class="bar-label">${esc(g.l)}</span><div class="bar-track"><div class="bar-fill ${vc}" style="width:${pct}%"></div></div><span class="bar-value ${vc}">${g.v} <small>${esc(g.u)}</small></span></div>`;
        }).join('') + '</div>';
      }
      if (view === 'numbers') {
        return '<div class="num-grid">' + items.map(g => {
          const vc = classify(g.key, g.v);
          return `<div class="num-item"><span class="num-label">${esc(g.l)}</span><span class="num-value ${vc}">${g.v}<small>${esc(g.u)}</small></span></div>`;
        }).join('') + '</div>';
      }
      return '<div class="gauge-row">' + items.map(g => {
        const r = 22, c = 2 * Math.PI * r, pct = Math.max(0, Math.min(1, g.v / g.max)), offset = c - pct * c;
        const vc = classify(g.key, g.v);
        return `<div class="gauge"><svg viewBox="0 0 56 56"><g transform="rotate(-90 28 28)"><circle class="ring-bg" cx="28" cy="28" r="${r}"/><circle class="ring-fg ${vc}" cx="28" cy="28" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/></g><text x="28" y="28" text-anchor="middle" dominant-baseline="central" class="gauge-num">${g.v}</text></svg><div class="g-label">${esc(g.l)}</div><div class="g-unit">${esc(g.u)}</div></div>`;
      }).join('') + '</div>';
    }

    function filteredRooms() {
      const q = filterQuery.trim().toLowerCase();
      if (!q) return ROOMS;
      return ROOMS.filter(r =>
        r.id.toLowerCase().includes(q) ||
        r.patient.toLowerCase().includes(q) ||
        r.procedure.toLowerCase().includes(q)
      );
    }

    function updateRoomCount(list) {
      document.getElementById('ot-count').textContent =
        list.length === ROOMS.length
          ? `${ROOMS.length} rooms`
          : `${list.length} of ${ROOMS.length} rooms`;
    }

    function roomById(id) {
      return ROOMS.find(r => r.id === id);
    }

    function stripRooms() {
      return stripIds.map(id => roomById(id)).filter(Boolean);
    }

    function remainingRooms() {
      const pinned = new Set(stripIds);
      return filteredRooms().filter(r => !pinned.has(r.id));
    }

    function promoteToStrip(id) {
      stripIds = [id, ...stripIds.filter(x => x !== id)].slice(0, STRIP_SIZE);
    }

    function theatreCardHtml(room, selected) {
      const sel = selected ? ' selected' : '';
      const { name, asa } = parsePatient(room.patient);
      const asaHtml = asa
        ? `<span class="theatre-asa-below">${esc(asa)}</span>`
        : '<span class="theatre-asa-below">—</span>';
      const stage = currentStageForPct(room.completion.pct);
      const alertBelow = room.alert
        ? `<div class="theatre-card-alert-below" title="${esc(room.alert)}">⚠ ${esc(room.alert)}</div>`
        : '<div class="theatre-card-alert-below is-empty" aria-hidden="true">&nbsp;</div>';
      return `<button type="button" class="ot-theatre-card${sel}" data-id="${esc(room.id)}" data-status="${room.status}">
          <div class="theatre-card-inner">
            <div class="theatre-card-body">
              <div class="theatre-card-main">
                <div class="theatre-card-header">
                  <div class="theatre-card-meta-line">
                    <span class="theatre-id">${esc(room.id)}</span>
                    <span class="theatre-card-meta-sep">|</span>
                    <span class="theatre-stage">${esc(stage.name)}</span>
                  </div>
                  ${alertBelow}
                  <p class="theatre-patient-line"><span class="theatre-patient-label">Patient Name:-</span><span class="theatre-patient-value">${esc(name)}</span></p>
                </div>
                <p class="theatre-proc">${esc(room.procedure)}</p>
                ${asaHtml}
              </div>
              <div class="theatre-card-right">
                ${progressPieHtml(room.completion.pct, 'Completed')}
              </div>
            </div>
            <div class="theatre-strip-vitals">${stripVitalsHtml(room.vitals)}</div>
          </div>
        </button>`;
    }

    function isMobileView() {
      return window.matchMedia('(max-width: 720px)').matches;
    }

    function bindTheatreCards(container, fromMore) {
      container.querySelectorAll('.ot-theatre-card').forEach(btn => {
        btn.addEventListener('click', () => {
          selectRoom(btn.dataset.id, { fromMore: fromMore && !isMobileView() });
        });
      });
    }

    function expandButtonHtml(count) {
      if (!count) return '';
      return `<button type="button" class="ot-expand-btn${moreOpen ? ' open' : ''}" id="ot-expand-btn" aria-expanded="${moreOpen ? 'true' : 'false'}" aria-controls="ot-more-panel" title="Show ${count} more rooms">
        <span class="ot-expand-chevron" aria-hidden="true">▼</span>
        <span class="ot-expand-count">+${count}</span>
      </button>`;
    }

    function syncExpandButtonState() {
      const btn = document.getElementById('ot-expand-btn');
      if (!btn) return;
      btn.classList.toggle('open', moreOpen);
      btn.setAttribute('aria-expanded', moreOpen ? 'true' : 'false');
    }

    function setMorePanelOpen(open, afterClose) {
      morePanelAnimToken += 1;
      const animToken = morePanelAnimToken;
      const panel = document.getElementById('ot-more-panel');
      const grid = document.getElementById('ot-more-grid');
      const remaining = remainingRooms();
      if (!remaining.length) {
        moreOpen = false;
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden', 'true');
        grid.innerHTML = '';
        syncExpandButtonState();
        afterClose?.();
        return;
      }

      if (open) {
        renderMoreGrid();
        moreOpen = true;
        panel.setAttribute('aria-hidden', 'false');
        syncExpandButtonState();
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if (animToken !== morePanelAnimToken || !moreOpen) return;
            panel.classList.add('open');
          });
        });
        return;
      }

      if (!moreOpen && !panel.classList.contains('open')) {
        afterClose?.();
        return;
      }

      moreOpen = false;
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      syncExpandButtonState();

      let finished = false;
      const finish = () => {
        if (finished) return;
        finished = true;
        panel.removeEventListener('transitionend', onEnd);
        if (!moreOpen) grid.innerHTML = '';
        afterClose?.();
      };
      const onEnd = e => {
        if (e.target !== panel) return;
        if (e.propertyName === 'grid-template-rows' || e.propertyName === 'opacity') finish();
      };
      panel.addEventListener('transitionend', onEnd);
      setTimeout(finish, 480);
    }

    function renderMoreGrid() {
      const grid = document.getElementById('ot-more-grid');
      const list = remainingRooms();
      if (!list.length) {
        grid.innerHTML = '';
        return;
      }
      grid.innerHTML = list.map(room => theatreCardHtml(room, room.id === selectedId)).join('');
      bindTheatreCards(grid, true);
    }

    function mobileFilteredKey() {
      const q = filterQuery.trim().toLowerCase();
      return q + '|' + filteredRooms().map(r => r.id).join(',');
    }

    function syncMobileSelectionState(prevSelectedId) {
      if (prevSelectedId && prevSelectedId !== selectedId) {
        const prevItem = document.querySelector(`.ot-mobile-item[data-id="${CSS.escape(prevSelectedId)}"]`);
        if (prevItem) {
          prevItem.classList.add('instant-collapse');
          prevItem.classList.remove('is-open');
          prevItem.querySelector('.ot-theatre-card')?.classList.remove('selected');
          const expand = prevItem.querySelector('.ot-card-expand');
          expand?.classList.remove('open');
          expand?.setAttribute('aria-hidden', 'true');
          const inner = prevItem.querySelector('.ot-card-expand-inner');
          if (inner) {
            inner.innerHTML = '';
            inner.className = 'ot-card-expand-inner';
            inner.removeAttribute('aria-busy');
          }
          requestAnimationFrame(() => prevItem.classList.remove('instant-collapse'));
        }
      }

      document.querySelectorAll('.ot-mobile-item').forEach(item => {
        const open = item.dataset.id === selectedId;
        item.classList.toggle('is-open', open);
        item.querySelector('.ot-theatre-card')?.classList.toggle('selected', open);
        const expand = item.querySelector('.ot-card-expand');
        if (!expand) return;
        expand.classList.toggle('open', open);
        expand.setAttribute('aria-hidden', open ? 'false' : 'true');
        if (!open) {
          const inner = item.querySelector('.ot-card-expand-inner');
          if (inner) {
            inner.innerHTML = '';
            inner.className = 'ot-card-expand-inner';
            inner.removeAttribute('aria-busy');
          }
        }
      });
    }

    function renderMobileStack() {
      const list = filteredRooms();
      updateRoomCount(list);
      const row = document.getElementById('ot-top-row');
      row.classList.add('mobile-stack');
      moreOpen = false;
      document.getElementById('ot-more-panel')?.classList.remove('open');

      if (!list.length) {
        row.innerHTML = '<p class="ot-count" style="padding:12px 4px">No rooms match your search.</p>';
        return;
      }

      row.innerHTML = list.map(room => {
        const open = room.id === selectedId;
        return `<div class="ot-mobile-item${open ? ' is-open' : ''}" data-id="${esc(room.id)}">
          ${theatreCardHtml(room, open)}
          <div class="ot-card-expand${open ? ' open' : ''}" aria-hidden="${open ? 'false' : 'true'}">
            <div class="ot-card-expand-inner"></div>
          </div>
        </div>`;
      }).join('');
      bindTheatreCards(row, false);
      syncVitalsViewBar();
    }

    function renderTopCards() {
      const row = document.getElementById('ot-top-row');
      if (isMobileView()) {
        const key = mobileFilteredKey();
        if (key === mobileStackKey && row.querySelector('.ot-mobile-item')) {
          syncVitalsViewBar();
          return;
        }
        mobileStackKey = key;
        renderMobileStack();
        return;
      }
      mobileStackKey = '';
      row.classList.remove('mobile-stack');

      const list = filteredRooms();
      updateRoomCount(list);
      const strip = stripRooms();
      const remaining = remainingRooms();
      if (!strip.length) {
        row.innerHTML = '<p class="ot-count" style="padding:12px 4px;grid-column:1/-1">No pinned rooms.</p>';
      } else {
        row.innerHTML = strip.map(room => theatreCardHtml(room, room.id === selectedId)).join('') + expandButtonHtml(remaining.length);
        bindTheatreCards(row, false);
        const expandBtn = document.getElementById('ot-expand-btn');
        expandBtn?.addEventListener('click', e => {
          e.preventDefault();
          const panel = document.getElementById('ot-more-panel');
          const isOpen = moreOpen || panel.classList.contains('open');
          setMorePanelOpen(!isOpen);
        });
      }
      if (moreOpen) {
        renderMoreGrid();
        const panel = document.getElementById('ot-more-panel');
        if (panel.classList.contains('open')) {
          panel.setAttribute('aria-hidden', 'false');
        }
      }
      syncExpandButtonState();
      syncVitalsViewBar();
    }

    function cancelDetailLoad() {
      if (detailLoadTimer != null) {
        clearTimeout(detailLoadTimer);
        detailLoadTimer = null;
      }
    }

    function renderDetailEmpty() {
      if (isMobileView()) return;
      const el = document.getElementById('detail-content');
      setDetailPanelHeadline(null);
      el.className = 'detail-empty';
      el.removeAttribute('aria-busy');
      el.innerHTML = 'Select an OT room above to view live vitals and case details.';
    }

    function mobileExpandInner(roomId) {
      if (!roomId) return null;
      return document.querySelector(`.ot-mobile-item[data-id="${CSS.escape(roomId)}"] .ot-card-expand-inner`);
    }

    function viewToggleHtml() {
      const labels = { rings: 'Rings', bars: 'Bars', numbers: 'Numbers' };
      return `<div class="view-toggle" role="group" aria-label="Vitals display">${['rings', 'bars', 'numbers'].map(v =>
        `<button type="button" data-view="${v}" class="${view === v ? 'active' : ''}">${labels[v]}</button>`
      ).join('')}</div>`;
    }

    function syncVitalsViewBar() {
      const bar = document.getElementById('ot-vitals-view-bar');
      if (!bar) return;
      const show = isMobileView() && selectedId;
      bar.hidden = !show;
      bar.classList.toggle('is-visible', show);
      if (show) {
        bar.innerHTML = `<span class="ot-vitals-view-bar-label">Patient vitals display</span>${viewToggleHtml()}`;
      } else {
        bar.innerHTML = '';
      }
    }

    function mobileExpandBodyHtml(room) {
      const c = room.completion;
      const detail = (g, t, cls) => `<div class="detail-group ${cls}"><h4>${t}</h4>${vitalGroup(room.detail[g])}</div>`;
      return `
        <div class="mobile-expand-body">
          ${stagesQuickActionsHtml(c.pct, { allStages: true })}
          <div class="detail-vitals mobile-expand-vitals">
            <h3>Patient vitals</h3>
            <div class="detail-inner">
              ${detail('hemo', 'HEMODYNAMICS', 'hemo')}
              ${detail('vent', 'VENTILATION', 'vent')}
              ${detail('temp', 'TEMPERATURE', 'temp')}
            </div>
          </div>
        </div>`;
    }

    function detailBodyHtml(room, opts = {}) {
      if (opts.mobileExpand) return mobileExpandBodyHtml(room);

      const c = room.completion;
      const detail = (g, t, cls) => `<div class="detail-group ${cls}"><h4>${t}</h4>${vitalGroup(room.detail[g])}</div>`;
      return `
        <div class="detail-hero">
          ${stagesQuickActionsHtml(c.pct, { allStages: true })}
        </div>
        <div class="detail-vitals">
          <h3>Patient vitals</h3>
          <div class="detail-inner">
            ${detail('hemo', 'HEMODYNAMICS', 'hemo')}
            ${detail('vent', 'VENTILATION', 'vent')}
            ${detail('temp', 'TEMPERATURE', 'temp')}
          </div>
        </div>`;
    }

    function showDetailLoading(roomId, targetEl) {
      const el = targetEl || document.getElementById('detail-content');
      const room = roomById(roomId);
      if (!targetEl) {
        if (room) {
          document.getElementById('detail-panel-title').innerHTML =
            `${esc(room.id)} <span class="detail-title-sep">|</span> ${esc(room.procedure)} <span class="detail-title-sep">|</span> <span style="color:var(--ink-soft);font-weight:500">Loading…</span>`;
          document.getElementById('detail-panel-badges').innerHTML = '';
        } else {
          setDetailPanelHeadline(null);
        }
      }
      el.className = targetEl ? 'ot-card-expand-inner detail-empty detail-loading' : 'detail-empty detail-loading';
      el.setAttribute('aria-busy', 'true');
      el.innerHTML = `
        <div class="detail-load-spinner" role="presentation" aria-hidden="true"></div>
        <p class="detail-load-text">Loading room details</p>
        <p class="detail-load-sub">${room ? `Syncing vitals and case data for ${esc(room.id)}…` : 'Please wait…'}</p>`;
    }

    function renderDetailContent(room, targetEl) {
      const el = targetEl || document.getElementById('detail-content');
      const mobile = Boolean(targetEl);
      if (!mobile) {
        setDetailPanelHeadline(room);
        el.className = 'detail-body';
      } else {
        el.className = 'ot-card-expand-inner detail-body';
      }
      el.removeAttribute('aria-busy');
      el.innerHTML = detailBodyHtml(room, { mobileExpand: mobile });
    }

    function renderDetail(opts = {}) {
      const immediate = opts.immediate === true;
      cancelDetailLoad();

      if (!selectedId) {
        renderDetailEmpty();
        return;
      }

      const room = roomById(selectedId);
      if (!room) {
        renderDetailEmpty();
        return;
      }

      if (isMobileView()) {
        const inner = mobileExpandInner(selectedId);
        if (!inner) return;
        renderDetailContent(room, inner);
        return;
      }

      if (immediate) {
        renderDetailContent(room);
        return;
      }

      const loadForId = selectedId;
      showDetailLoading(loadForId);
      detailLoadTimer = setTimeout(() => {
        detailLoadTimer = null;
        if (selectedId !== loadForId) return;
        const current = roomById(loadForId);
        if (current) renderDetailContent(current);
      }, DETAIL_LOAD_MS);
    }

    function selectRoom(id, opts) {
      const options = typeof opts === 'object' && opts !== null ? opts : { scrollIntoView: opts !== false };

      if (isMobileView()) {
        const prevSelectedId = selectedId;
        if (selectedId === id) {
          selectedId = null;
        } else {
          selectedId = id;
        }
        syncMobileSelectionState(prevSelectedId);
        syncVitalsViewBar();
        if (selectedId) {
          renderDetail({ immediate: true });
        } else {
          cancelDetailLoad();
        }
        return;
      }

      if (options.fromMore) {
        const roomId = id;
        setMorePanelOpen(false, () => {
          promoteToStrip(roomId);
          selectedId = roomId;
          renderTopCards();
          renderDetail();
          if (options.scrollIntoView !== false) {
            requestAnimationFrame(() => {
              const el = document.querySelector(`#ot-top-row .ot-theatre-card[data-id="${CSS.escape(roomId)}"]`);
              el?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            });
          }
        });
        return;
      }
      selectedId = id;
      renderTopCards();
      renderDetail();
      if (options.scrollIntoView !== false) {
        requestAnimationFrame(() => {
          const el = document.querySelector(`#ot-top-row .ot-theatre-card[data-id="${CSS.escape(id)}"]`);
          el?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        });
      }
    }

    document.getElementById('ot-search').addEventListener('input', e => {
      filterQuery = e.target.value;
      if (selectedId && !filteredRooms().some(r => r.id === selectedId)) {
        selectedId = null;
      }
      renderTopCards();
      if (!selectedId) renderDetail();
      else if (isMobileView() || document.getElementById('detail-content').classList.contains('detail-body')) {
        renderDetail({ immediate: true });
      }
    });

    document.addEventListener('click', e => {
      const btn = e.target.closest('.view-toggle [data-view]');
      if (!btn) return;
      view = btn.dataset.view;
      document.querySelectorAll('.view-toggle [data-view]').forEach(b => {
        b.classList.toggle('active', b.dataset.view === view);
      });
      syncVitalsViewBar();
      if (isMobileView() && selectedId) {
        renderDetail({ immediate: true });
      } else if (document.getElementById('detail-content').classList.contains('detail-body')) {
        renderDetail({ immediate: true });
      }
    });

    let layoutWasMobile = isMobileView();
    window.addEventListener('resize', () => {
      const mobile = isMobileView();
      if (mobile === layoutWasMobile) return;
      layoutWasMobile = mobile;
      moreOpen = false;
      renderTopCards();
      if (selectedId) renderDetail({ immediate: true });
      else renderDetailEmpty();
    });

    renderTopCards();
    renderDetail();
  </script>
</body>
</html>
